# Default deny for everything in the namespace, then one rule per allowed flow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Only payments-api may open connections to the vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: token-vault-ingress
  namespace: payments
spec:
  podSelector:
    matchLabels: { app: token-vault }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: payments-api }
      ports:
        - { protocol: TCP, port: 8080 }
---
# The vault's only outbound need is AWS KMS over HTTPS. NetworkPolicy can't match DNS names,
# so this allows port 443 to public addresses and blocks the metadata service and internal ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: token-vault-egress
  namespace: payments
spec:
  podSelector:
    matchLabels: { app: token-vault }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 10.42.0.0/16, 10.43.0.0/16, 172.31.0.0/16]
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-api-egress
  namespace: payments
spec:
  podSelector:
    matchLabels: { app: payments-api }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: token-vault }
      ports:
        - { protocol: TCP, port: 8080 }
    - to: # Okta (Phase 2) and the Claude API (Phase 3)
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 10.42.0.0/16, 10.43.0.0/16, 172.31.0.0/16]
      ports:
        - { protocol: TCP, port: 443 }
