apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-vault
  namespace: payments
automountServiceAccountToken: false # the vault never talks to the Kubernetes API
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: token-vault-data
  namespace: payments
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-vault
  namespace: payments
  labels: { app: token-vault }
spec:
  replicas: 1
  strategy: { type: Recreate } # SQLite on a ReadWriteOnce volume: one writer at a time
  selector:
    matchLabels: { app: token-vault }
  template:
    metadata:
      labels: { app: token-vault }
    spec:
      serviceAccountName: token-vault
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: token-vault
          image: ghcr.io/michaelkhintz/protected-payments-api/token-vault@TOKEN_VAULT_DIGEST
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: AWS_REGION, value: us-east-1 }
            - { name: KMS_KEY_ID, value: alias/payments-lab-vault }
            - { name: HMAC_KEY_ID, value: alias/payments-lab-pan-hmac }
            - { name: DB_PATH, value: /data/vault.db }
            - { name: PORT, value: "8443" }
            - { name: AWS_SHARED_CREDENTIALS_FILE, value: /var/run/secrets/aws/credentials }
            - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
            # mTLS: our certificate, and the CA that client certificates must chain to
            - { name: TLS_CERT_FILE, value: /var/run/tls/tls.crt }
            - { name: TLS_KEY_FILE, value: /var/run/tls/tls.key }
            - { name: TLS_CA_FILE, value: /var/run/tls/ca.crt }
            # Authorization by certificate identity (URI SAN)
            - { name: TOKENIZE_CALLERS, value: "spiffe://payments-lab/ns/payments/sa/payments-api" }
            - { name: DETOKENIZE_CALLERS, value: "spiffe://payments-lab/ns/payments/sa/settlement-worker" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: aws-credentials, mountPath: /var/run/secrets/aws, readOnly: true }
            - { name: tls, mountPath: /var/run/tls, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: https } # an HTTPS probe would fail: kubelet has no client certificate
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: https }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: token-vault-data }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: aws-credentials
          secret: { secretName: token-vault-aws, defaultMode: 0440 }
        - name: tls
          secret: { secretName: token-vault-tls, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: token-vault
  namespace: payments
spec:
  selector: { app: token-vault }
  ports:
    - { name: https, port: 8443, targetPort: https }
